<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>H1CL Oral Revision Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* 玻璃拟态卡片容器 */
        .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 翻转逻辑 */
        .card-container {
            perspective: 1000px;
            width: 90vw;
            max-width: 400px;
            height: 60vh;
            max-height: 600px;
            margin: auto;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .is-flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* 内容溢出处理 */
        .content-scroll {
            flex-1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .content-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .content-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* 字体大小控制 */
        .word-text {
            font-size: clamp(2.5rem, 10vw, 4rem);
            line-height: 1.2;
            word-break: break-all;
        }

        .highlight {
            color: #34d399;
            font-weight: bold;
            border-bottom: 2px solid #34d399;
        }

        /* 手机适配 */
        @media (max-height: 700px) {
            .card-container { height: 75vh; }
            .word-text { font-size: clamp(2rem, 8vw, 3rem); }
        }
    </style>
</head>
<body>

    <!-- 顶部信息 -->
    <header class="p-4 text-center">
        <p class="text-[10px] tracking-[0.3em] text-emerald-400 font-bold uppercase">Topic: Technology vs Tradition</p>
        <h1 class="text-lg font-bold">科技对传统事物的影响</h1>
        <div id="counter" class="text-xs text-slate-500 mt-1 font-mono">01 / 20</div>
    </header>

    <!-- 进度条 -->
    <div class="px-6 mb-2">
        <div class="h-1 bg-slate-800 rounded-full w-full max-w-md mx-auto overflow-hidden">
            <div id="progress" class="h-full bg-emerald-500 transition-all duration-300" style="width: 5%"></div>
        </div>
    </div>

    <!-- 提示语 -->
    <div class="text-center text-[9px] text-slate-500 uppercase tracking-widest mb-2 px-4">
        <span class="md:hidden">Swipe Left/Right to Navigate • Tap to Flip</span>
        <span class="hidden md:inline">Use Arrows/Space to Navigate • Click to Flip</span>
    </div>

    <!-- 闪卡主体 -->
    <div class="card-container" id="main-container">
        <div class="card-inner" id="card-inner">
            
            <!-- 正面：词语和拼音 -->
            <div class="card-front glass-card flex flex-col justify-between" onclick="toggleFlip()">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] text-slate-500 font-bold uppercase">Vocab</span>
                    <button onclick="speakWord(event)" class="w-8 h-8 flex items-center justify-center bg-emerald-500/20 text-emerald-400 rounded-full">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H3a1 1 0 01-1-1V8a1 1 0 011-1h1.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.983 5.983 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.984 3.984 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
                <div class="flex-1 flex flex-col justify-center items-center text-center py-4">
                    <div id="pinyin-text" class="text-emerald-400 font-serif text-lg mb-2">táo tài</div>
                    <div id="word-text" class="word-text font-black text-white px-2">淘汰</div>
                </div>
                <div class="text-center text-[10px] text-slate-600 font-bold uppercase py-2">Click to View Details</div>
            </div>

            <!-- 背面：解释和搭配 -->
            <div class="card-back glass-card flex flex-col" onclick="toggleFlip()">
                <div class="flex justify-between items-center mb-4">
                    <span id="word-back-title" class="font-bold text-emerald-400">淘汰</span>
                    <span class="text-[10px] text-slate-500 font-bold uppercase">Explanation</span>
                </div>
                
                <div class="content-scroll flex-1 space-y-4 text-left">
                    <div>
                        <h4 class="text-[9px] font-bold text-slate-500 uppercase mb-1">Meaning / 解释</h4>
                        <p id="zh-meaning" class="text-base text-slate-200 leading-snug"></p>
                        <p id="en-meaning" class="text-xs text-slate-400 italic mt-1"></p>
                    </div>

                    <div>
                        <h4 class="text-[9px] font-bold text-slate-500 uppercase mb-1">Collocation / 搭配</h4>
                        <p id="collocation" class="text-sm text-emerald-100 bg-emerald-900/30 p-2 rounded-lg border border-emerald-500/20"></p>
                    </div>

                    <div class="pb-4">
                        <h4 class="text-[9px] font-bold text-slate-500 uppercase mb-1">Example / 例句</h4>
                        <p id="example-sentence" class="text-sm text-slate-300 leading-relaxed"></p>
                    </div>
                </div>
                <div class="text-center text-[9px] text-slate-600 font-bold uppercase pt-2 border-t border-white/5">Tap to return</div>
            </div>

        </div>
    </div>

    <!-- 底部导航 -->
    <footer class="p-6 flex justify-between items-center max-w-md mx-auto w-full">
        <button onclick="changeCard(-1)" class="w-12 h-12 flex items-center justify-center rounded-full border border-slate-800 text-slate-400 hover:border-emerald-500 hover:text-white transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        </button>
        
        <div class="text-[10px] font-bold text-slate-700 uppercase tracking-widest">H1CL Revision</div>

        <button onclick="changeCard(1)" class="w-12 h-12 flex items-center justify-center rounded-full border border-slate-800 text-slate-400 hover:border-emerald-500 hover:text-white transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
        </button>
    </footer>

    <script>
        const cards = [
            { word: "淘汰", pinyin: "táo tài", zh: "在竞争中去掉差的、不合适的。", en: "To eliminate through competition.", coll: "被时代淘汰 / 逐步淘汰", ex: "如果不跟上科技的步伐，传统行业很容易被时代{淘汰}。" },
            { word: "并存", pinyin: "bìng cún", zh: "同时存在。", en: "Coexist.", coll: "长期并存 / 多元并存", ex: "在未来的很长一段时间里，电子书与纸质书将会长期{并存}。" },
            { word: "普及", pinyin: "pǔ jí", zh: "普遍推广，使大众化。", en: "Popularize / Universal.", coll: "广泛普及 / 电脑普及", ex: "随着智能手机的{普及}，数字化阅读已成为一种生活方式。" },
            { word: "趋势", pinyin: "qū shì", zh: "事物发展的方向。", en: "Trend / Tendency.", coll: "必然趋势 / 发展趋势", ex: "无纸化办公和阅读是未来发展的必然{趋势}。" },
            { word: "携带", pinyin: "xié dài", zh: "随身带着。", en: "Carry / Portable.", coll: "携带方便 / 随身携带", ex: "电子书的一大优点是轻便，非常适合外出时{携带}。" },
            { word: "没落", pinyin: "mò luò", zh: "衰败；趋向灭亡。", en: "Decline / Fade away.", coll: "走向没落 / 行业没落", ex: "新事物的出现并不代表传统书籍的{没落}。" },
            { word: "可持续", pinyin: "kě chí xù", zh: "可以继续维持下去。", en: "Sustainable.", coll: "可持续发展 / 可持续资源", ex: "减少纸张消耗符合环保与{可持续}发展的理念。" },
            { word: "流行", pinyin: "liú xíng", zh: "广泛传播；盛行。", en: "Popular / Trendy.", coll: "广泛流行 / 流行趋势", ex: "有声书是近几年来非常{流行}的新型阅读选择。" },
            { word: "阅读疲劳", pinyin: "yuè dú pí láo", zh: "因长时间阅读导致的眼睛或精神疲倦。", en: "Reading fatigue.", coll: "产生阅读疲劳 / 造成疲劳", ex: "长时间盯着屏幕阅读容易产生电子屏幕引起的{阅读疲劳}。" },
            { word: "依赖", pinyin: "yī lài", zh: "依靠某物而不能自立。", en: "Depend on / Rely on.", coll: "过度依赖 / 产生依赖", ex: "现代人过于{依赖}电子设备，有时会忽略了写字的乐趣。" },
            { word: "网络资源", pinyin: "wǎng luò zī yuán", zh: "网络上的各类信息和数据。", en: "Online resources.", coll: "丰富的网络资源 / 共享资源", ex: "我们可以利用丰富的{网络资源}来进行深度学习。" },
            { word: "下载", pinyin: "xià zǎi", zh: "从互联网接收文件到设备。", en: "Download.", coll: "免费下载 / 在线下载", ex: "读者只需几秒钟就能{下载}到自己心仪的图书。" },
            { word: "阅读习惯", pinyin: "yuè dú xí guàn", zh: "长期养成的阅读方式。", en: "Reading habits.", coll: "养成阅读习惯 / 改变习惯", ex: "数字科技正在潜移默化地改变着年轻一代的{阅读习惯}。" },
            { word: "冲击", pinyin: "chōng jī", zh: "强大的力量带来的影响。", en: "Impact / Shock.", coll: "带来巨大冲击 / 面临冲击", ex: "电商平台对传统书店带来了前所未有的巨大{冲击}。" },
            { word: "便捷", pinyin: "biàn jié", zh: "快而方便。", en: "Convenient.", coll: "操作便捷 / 生活便捷", ex: "电子支付和数字阅读让我们的生活变得更加{便捷}。" },
            { word: "随时随地", pinyin: "suí shí suí dì", zh: "任何时间、任何地点。", en: "Anytime, anywhere.", coll: "随时随地学习 / 随时随地阅读", ex: "移动终端让我们能够{随时随地}获取最新的新闻资讯。" },
            { word: "专注力", pinyin: "zhuān zhù lì", zh: "一心一意、集中精神的能力。", en: "Concentration / Focus.", coll: "培养专注力 / 分散专注力", ex: "纸质书更能让人沉浸其中，提高阅读的{专注力}。" },
            { word: "辅助功能", pinyin: "fǔ zhù gōng néng", zh: "起辅助作用的功能。", en: "Auxiliary functions.", coll: "提供辅助功能 / 实用功能", ex: "电子书内置的字典和搜索等{辅助功能}非常实用。" },
            { word: "情怀", pinyin: "qíng huái", zh: "拥有的某种感情或心境。", en: "Sentiment / Feelings.", coll: "怀旧情怀 / 书卷情怀", ex: "对于老一辈读者来说，墨香是一种难以取代的{情怀}。" },
            { word: "收藏价值", pinyin: "shōu cáng jià zhí", zh: "值得收集和保存的价值。", en: "Collection value.", coll: "具有收藏价值 / 提升价值", ex: "一些精装版书籍不仅可以阅读，还具有很高的{收藏价值}。" }
        ];

        let index = 0;
        let startTouchX = 0;

        function updateCard() {
            const data = cards[index];
            const inner = document.getElementById('card-inner');
            inner.classList.remove('is-flipped'); // 切换时重置为正面
            
            // 正面内容
            document.getElementById('word-text').innerText = data.word;
            document.getElementById('pinyin-text').innerText = data.pinyin;
            
            // 背面内容
            document.getElementById('word-back-title').innerText = data.word;
            document.getElementById('zh-meaning').innerText = data.zh;
            document.getElementById('en-meaning').innerText = data.en;
            document.getElementById('collocation').innerText = data.coll;
            
            // 例句高亮处理
            const exHtml = data.ex.replace(`{${data.word}}`, `<span class="highlight">${data.word}</span>`);
            document.getElementById('example-sentence').innerHTML = exHtml;

            // 进度
            document.getElementById('counter').innerText = `${(index + 1).toString().padStart(2, '0')} / ${cards.length}`;
            document.getElementById('progress').style.width = `${((index + 1) / cards.length) * 100}%`;
        }

        function toggleFlip() {
            document.getElementById('card-inner').classList.toggle('is-flipped');
        }

        function changeCard(step) {
            index = (index + step + cards.length) % cards.length;
            updateCard();
        }

        function speakWord(e) {
            e.stopPropagation();
            const speech = new SpeechSynthesisUtterance(cards[index].word);
            speech.lang = 'zh-CN';
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(speech);
        }

        // 手势支持
        const container = document.getElementById('main-container');
        container.addEventListener('touchstart', e => startTouchX = e.touches[0].clientX, {passive: true});
        container.addEventListener('touchend', e => {
            const endX = e.changedTouches[0].clientX;
            const diff = startTouchX - endX;
            if (Math.abs(diff) > 50) {
                changeCard(diff > 0 ? 1 : -1);
            }
        });

        // 键盘支持
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') changeCard(1);
            if (e.key === 'ArrowLeft') changeCard(-1);
            if (e.code === 'Space') { e.preventDefault(); toggleFlip(); }
        });

        updateCard();
    </script>
</body>
</html>
